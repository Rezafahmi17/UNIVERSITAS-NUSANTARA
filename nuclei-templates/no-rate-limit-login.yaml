id: no-rate-limit-login

info:
  name: Missing Rate Limiting on Campus Portal Login Endpoint
  author: mahasiswa-ksi
  severity: medium
  description: |
    Endpoint autentikasi login tidak menerapkan rate limiting, CAPTCHA, maupun lockout akun setelah kegagalan berturut-turut. Hal ini memungkinkan serangan brute-force dan fuzzing kredensial kata sandi.
  reference:
    - https://cwe.mitre.org/data/definitions/307.html
    - https://owasp.org/www-community/controls/Blocking_Brute_Force_Attacks
  tags: auth,login,rate-limit,bruteforce,cwe-307

http:
  - raw:
      - |
        POST /api/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"mhs_dimas","password":"InvalidPassword1"}
      - |
        POST /api/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"mhs_dimas","password":"InvalidPassword2"}
      - |
        POST /api/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"mhs_dimas","password":"InvalidPassword3"}
      - |
        POST /api/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"mhs_dimas","password":"InvalidPassword4"}
      - |
        POST /api/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"mhs_dimas","password":"InvalidPassword5"}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 401

      - type: word
        words:
          - "Kredensial tidak valid"
          - "No rate-limit"
        part: body
        condition: and

      - type: status
        status:
          - 429
        negative: true
